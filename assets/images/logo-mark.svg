<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 84" fill="none">
  <!-- Official Everest Hexagonal Architectural Mark -->
  <!-- Right Face (White Background, Blue Outline) -->
  <polygon points="36,2 70,21 70,62 36,81 36,2" fill="#FFFFFF" stroke="#1026E8" stroke-width="2.6" stroke-linejoin="miter"/>
  <!-- Left Face (Solid Royal Blue Background) -->
  <polygon points="36,2 2,21 2,62 36,81 36,2" fill="#1026E8" stroke="#1026E8" stroke-width="2.6" stroke-linejoin="miter"/>
  <!-- Central Vertical Divider -->
  <line x1="36" y1="2" x2="36" y2="81" stroke="#FFFFFF" stroke-width="2.4"/>
  <!-- Left Side White Architectural Beams (Chevron Pattern) -->
  <polygon points="10,31 36,18 36,25 10,38" fill="#FFFFFF"/>
  <polygon points="10,49 36,36 36,43 10,56" fill="#FFFFFF"/>
  <!-- Right Side Blue Architectural Beams -->
  <polygon points="36,18 62,31 62,38 36,25" fill="#1026E8"/>
  <polygon points="36,36 62,49 62,56 36,43" fill="#1026E8"/>
</svg>
